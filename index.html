<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Weiß Grafik</title>

<style>

html,body{
    height:100%;
    margin:0;
}


body{
    background:#ffffff;
    overflow:hidden;
}



/* 背景 */

#random-background{

    position:fixed;

    inset:0;

    z-index:0;


    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;


    opacity:0;


    transform:scale(1);


    transition:

        opacity 2s ease,

        transform 10s ease;

}



#random-background.zoom{

    transform:scale(1.06);

}



/* 右下テキスト */

.center-link{

    position:fixed;

    right:32px;

    bottom:28px;


    z-index:2;


    color:#888;


    text-decoration:none;


    opacity:0.85;


    white-space:nowrap;


    font-family:

      "Helvetica Neue",
      Helvetica,
      Arial,
      sans-serif;

}



.main-text{

    font-size:16px;

    letter-spacing:0.18em;

}



.sub-text{

    font-size:12px;

    letter-spacing:0.18em;

    margin-left:-2px;

}



.center-link:hover{

    opacity:0.6;

}


</style>

</head>


<body>


<div id="random-background"></div>



<a class="center-link"
href="https://www.w-grafik.org/">

<span class="main-text">Weiß</span><span class="sub-text"> Grafik</span>

</a>





<script>

(function(){


const imageFolder="bg/";

const totalImages=50;


let currentImage=0;


const bg=document.getElementById(
"random-background"
);





function getRandomImage(){


let next;


do{


next=Math.floor(
Math.random()*totalImages
)+1;


}while(next===currentImage);



currentImage=next;


return "bg-"+
String(next).padStart(3,"0")+
".webp";


}





function changeBackground(){



const filename=getRandomImage();



const img=new Image();



img.onload=function(){



/* 完全リセット */

bg.classList.remove("zoom");

bg.style.transform="scale(1)";


void bg.offsetWidth;



/* 新しい背景 */

bg.style.backgroundImage=

"url('"+imageFolder+filename+"')";



/* 表示 */

bg.style.opacity="1";



/* ズーム開始 */

setTimeout(function(){


bg.classList.add("zoom");


},100);



};



img.src=imageFolder+filename;



}





// 初回

changeBackground();



// 10秒ごと

setInterval(

changeBackground,

10000

);



})();

</script>


</body>
</html>
