<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Weiß Grafik</title>

<style>

html,body{
    height:100%;
    margin:0;
    overflow:hidden;
}


body{
    background:#ffffff;
}



/* 背景 */

.bg-layer{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;


    object-fit:cover;

    object-position:center;


    opacity:0;


    z-index:0;

}



.bg-layer.active{

    opacity:1;

}



.bg-layer.zoom{

    animation:zoomImage 10s ease forwards;

}



@keyframes zoomImage{

    from{

        transform:scale(1);

    }

    to{

        transform:scale(1.06);

    }

}




/* フェード */

.fade{

    transition:opacity 2s ease;

}





/* 右下テキスト */

.center-link{

    position:fixed;

    right:32px;

    bottom:28px;


    z-index:10;


    color:#888;


    text-decoration:none;


    opacity:0.85;


    white-space:nowrap;


    font-family:

      "Helvetica Neue",
      Helvetica,
      Arial,
      sans-serif;

}



.main-text{

    font-size:16px;

    letter-spacing:0.18em;

}



.sub-text{

    font-size:12px;

    letter-spacing:0.18em;

    margin-left:-2px;

}



.center-link:hover{

    opacity:0.6;

}



</style>

</head>


<body>



<img id="bg1" class="bg-layer fade" src="">

<img id="bg2" class="bg-layer fade" src="">



<a class="center-link"
href="https://www.w-grafik.org/">

<span class="main-text">Weiß</span><span class="sub-text"> Grafik</span>

</a>





<script>

(function(){


const folder="bg/";

const totalImages=50;


let active=0;

let currentImage=0;


let history=[];



const layers=[

document.getElementById("bg1"),

document.getElementById("bg2")

];





function getImage(){


let next;


do{

next=Math.floor(
Math.random()*totalImages
)+1;


}while(

history.includes(next)

);



history.push(next);



if(history.length>10){

history.shift();

}



return "bg-"+String(next).padStart(3,"0")+".webp";


}






function changeBackground(){



const nextLayer=layers[1-active];

const oldLayer=layers[active];



const img=new Image();



const filename=getImage();



img.onload=function(){



nextLayer.src=

folder+filename;




/* アニメーション完全リセット */

nextLayer.classList.remove("zoom");

nextLayer.style.opacity="0";

void nextLayer.offsetWidth;



/* 表示 */

nextLayer.style.opacity="1";



/* ズーム開始 */

setTimeout(function(){


nextLayer.classList.add("zoom");


},50);




/* 古い画像を消す */

oldLayer.style.opacity="0";



active=1-active;



};



img.src=

folder+filename;



}




changeBackground();



setInterval(

changeBackground,

10000

);



})();

</script>


</body>
</html>
