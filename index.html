<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Weiß Grafik</title>

<style>

html,body{
    height:100%;
    margin:0;
    overflow:hidden;
}


body{
    background:#ffffff;
}



/* 背景画像 */

.bg-image{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;


    object-fit:cover;

    object-position:center;


    opacity:0;

    z-index:0;


    animation:

        fadeIn 2s ease forwards,

        zoomImage 10s ease forwards;

}



@keyframes fadeIn{

    from{

        opacity:0;

    }

    to{

        opacity:1;

    }

}



@keyframes zoomImage{

    from{

        transform:scale(1);

    }

    to{

        transform:scale(1.06);

    }

}




/* 右下テキスト */

.center-link{

    position:fixed;

    right:32px;

    bottom:28px;


    z-index:10;


    color:#888;


    text-decoration:none;


    opacity:0.85;


    white-space:nowrap;


    font-family:

      "Helvetica Neue",
      Helvetica,
      Arial,
      sans-serif;

}



.main-text{

    font-size:16px;

    letter-spacing:0.18em;

}



.sub-text{

    font-size:12px;

    letter-spacing:0.18em;

    margin-left:-2px;

}



.center-link:hover{

    opacity:0.6;

}



</style>

</head>


<body>


<a class="center-link"
href="https://www.w-grafik.org/">

<span class="main-text">Weiß</span><span class="sub-text"> Grafik</span>

</a>




<script>

(function(){


const folder="bg/";

const totalImages=50;


let currentImage=0;


let currentElement=null;



function randomImage(){


let next;


do{

next=Math.floor(
Math.random()*totalImages
)+1;


}while(next===currentImage);



currentImage=next;



return folder+

"bg-"+String(next).padStart(3,"0")+

".webp";

}




function changeBackground(){



const img=document.createElement("img");


img.className="bg-image";

img.src=randomImage();



img.onload=function(){



document.body.insertBefore(

img,

document.querySelector(".center-link")

);





/* 前の画像を削除 */

if(currentElement){

setTimeout(function(){

currentElement.remove();

},2000);

}



currentElement=img;



};



}





// 初回

changeBackground();



// 10秒ごと

setInterval(

changeBackground,

10000

);



})();

</script>


</body>
</html>
