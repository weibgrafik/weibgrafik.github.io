```html
<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Weiß Grafik</title>

<meta name="description"
      content="Weiß Grafik">

<style>

/* =========================================================
   RESET
========================================================= */

html,
body{

    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#ffffff;

}

/* =========================================================
   BACKGROUND
========================================================= */

#bg-container{

    position:fixed;

    inset:0;

    overflow:hidden;

    z-index:0;

    background:#ffffff;

}


/* ここへ background.js が
   <img> を2枚生成します */

.bg{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center;

    opacity:0;

    will-change:
        opacity,
        transform;

}


/* =========================================================
   LINK
========================================================= */

.site-link{

    position:fixed;

    right:34px;

    bottom:30px;

    z-index:10;

    color:#9a9a9a;

    text-decoration:none;

    white-space:nowrap;

    user-select:none;

    transition:opacity .25s ease;

    font-family:

        "Helvetica Neue",

        Helvetica,

        Arial,

        sans-serif;

}


.site-link:hover{

    opacity:.55;

}


.site-link strong{

    font-size:16px;

    font-weight:500;

    letter-spacing:.08em;

}


.site-link span{

    font-size:12px;

    margin-left:-2px;

    letter-spacing:.18em;

}


/* =========================================================
   LOADING
========================================================= */

#loading{

    position:fixed;

    inset:0;

    background:#ffffff;

    z-index:20;

    transition:opacity .8s ease;

}


#loading.hide{

    opacity:0;

    pointer-events:none;

}

</style>

</head>

<body>


<div id="bg-container">

<img id="bg1" class="bg">
<img id="bg2" class="bg">

</div>


<div id="loading"></div>


<a
class="site-link"
href="https://www.w-grafik.org/">

<strong>Weiß</strong><span> Grafik</span>

</a>


<script src="background.js"></script>

</body>
</html>
```
