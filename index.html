<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Weiß Grafik</title>

<style>

html,body{
    height:100%;
    margin:0;
    overflow:hidden;
}


body{
    background:#ffffff;
}



/* 背景画像 */

.bg-image{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;


    object-fit:cover;

    object-position:center;


    opacity:0;


    transform:scale(1);


    z-index:0;


    transition:

        opacity 2s ease,

        transform 10s ease;

}



.bg-image.zoom{

    transform:scale(1.06);

}



/* 右下テキスト */

.center-link{

    position:fixed;

    right:32px;

    bottom:28px;


    z-index:2;


    color:#888;


    text-decoration:none;


    opacity:0.85;


    white-space:nowrap;


    font-family:

      "Helvetica Neue",
      Helvetica,
      Arial,
      sans-serif;

}



.main-text{

    font-size:16px;

    letter-spacing:0.18em;

}



.sub-text{

    font-size:12px;

    letter-spacing:0.18em;

    margin-left:-2px;

}



.center-link:hover{

    opacity:0.6;

}


</style>

</head>


<body>


<img id="bg1" class="bg-image" src="">
<img id="bg2" class="bg-image" src="">



<a class="center-link"
href="https://www.w-grafik.org/">

<span class="main-text">Weiß</span><span class="sub-text"> Grafik</span>

</a>




<script>

(function(){


const folder="bg/";

const totalImages=50;


let currentImage=0;

let active=0;



const images=[

document.getElementById("bg1"),

document.getElementById("bg2")

];





function randomImage(){


let next;


do{

next=Math.floor(
Math.random()*totalImages
)+1;


}while(next===currentImage);



currentImage=next;



return folder+

"bg-"+String(next).padStart(3,"0")+

".webp";

}





function changeBackground(){



const next=images[1-active];

const old=images[active];



const src=randomImage();



const preload=new Image();



preload.onload=function(){



next.src=src;



/* ズーム状態リセット */

next.classList.remove("zoom");


next.style.opacity="0";



/* CSS変化を強制反映 */

void next.offsetWidth;



/* フェード開始 */

next.style.opacity="1";



/* ズーム開始 */

setTimeout(function(){


next.classList.add("zoom");


},100);



/* 古い画像を消す */

old.style.opacity="0";



active=1-active;



};



preload.src=src;



}





// 初回

changeBackground();



// 10秒ごと

setInterval(

changeBackground,

10000

);



})();

</script>


</body>
</html>
