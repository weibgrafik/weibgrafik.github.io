<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Weiß Grafik</title>

<style>

html,body{
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:#fff;
}


/* 背景 */

#background{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center;


    opacity:0;

    transform:scale(1);


    z-index:0;

}



/* フェード */

.fade-in{

    animation:fade 2s ease forwards;

}


@keyframes fade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}



/* ズーム */

.zoom{

    animation:zoom 10s ease forwards;

}



@keyframes zoom{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.06);
    }

}




/* 右下テキスト */

.center-link{

    position:fixed;

    right:32px;

    bottom:28px;

    z-index:5;


    color:#888;

    text-decoration:none;


    opacity:.85;


    font-family:
    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif;

    white-space:nowrap;

}


.main-text{

    font-size:16px;

    letter-spacing:.18em;

}


.sub-text{

    font-size:12px;

    letter-spacing:.18em;

    margin-left:-2px;

}


</style>

</head>


<body>


<img id="background" src="">



<a class="center-link"
href="https://www.w-grafik.org/">

<span class="main-text">Weiß</span><span class="sub-text"> Grafik</span>

</a>




<script>


(function(){


const folder="bg/";

const totalImages=50;


let current=0;


let history=[];



const bg=document.getElementById("background");





function getRandom(){


let n;


do{

n=Math.floor(Math.random()*totalImages)+1;


}while(history.includes(n));



history.push(n);



if(history.length>15){

history.shift();

}



return folder+
"bg-"+String(n).padStart(3,"0")+
".webp";


}




function changeBackground(){


const preload=new Image();


const src=getRandom();



preload.onload=function(){


bg.classList.remove(
"fade-in",
"zoom"
);



void bg.offsetWidth;



bg.src=src;



/* 少し待ってから開始 */

setTimeout(function(){


bg.classList.add(
"fade-in",
"zoom"
);


},50);



};



preload.src=src;


}




changeBackground();



setInterval(

changeBackground,

10000

);



})();


</script>


</body>
</html>
