<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Weiß Grafik</title>

<style>

html, body {
  height:100%;
  margin:0;
}


/* 初期背景 */
body {
  background:#ffffff;
}


/* ランダム背景 */
#random-background {
  position:fixed;
  inset:0;
  z-index:0;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  opacity:1;
  transform:scale(1);
  transition:
    opacity 3s ease,
    transform 20s ease;
}


#random-background.zoom {
  transform:scale(1.08);
}


/* 暗さ調整 */
#background-filter {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0);
  z-index:1;
}


.image-wrapper {
  position:relative;
  z-index:2;
}


/* ズーム */
#random-background.zoom {
  transform:scale(1.12);
}





/* ロゴ画像 */
.image-wrapper {
  position:relative;
  display:inline-block;
}


.image-wrapper img {
  max-width:80vw;
  max-height:80vh;
  display:block;
}


/* リンク範囲 */
.link-area {
  position:absolute;
  top:40%;
  left:10%;
  width:80%;
  height:50%;
  cursor:pointer;
}


/* 確認用（公開時不要なら削除）
.link-area:hover {
 outline:2px dashed rgba(255,255,255,0.5);
}
*/

</style>

</head>


<body>


<!-- 背景 -->
<div id="random-background"></div>
<div id="background-filter"></div>



<!-- ロゴ -->
<div class="image-wrapper">

<img src="wimg.jpg" alt="Weiß Grafik">


<a
class="link-area"
href="https://www.w-grafik.org/"
title="Weiß Grafik">
</a>


</div>


<script>

(function(){

const imageFolder = "bg/";
const totalImages = 48;

let currentImage = 0;

const bg = document.getElementById(
"random-background"
);


function changeBackground(){


let next;


do {

next =
Math.floor(Math.random()*totalImages)+1;

} while(next === currentImage);



currentImage = next;



const filename =
"bg-" +
String(next).padStart(3,"0") +
".webp";



const img = new Image();



img.onload=function(){


/*
最初の画像は白背景から
ゆっくり表示
*/

if(bg.style.backgroundImage===""){


bg.style.backgroundImage =
"url('" + imageFolder + filename + "')";


setTimeout(function(){

bg.style.opacity="1";
bg.classList.add("zoom");

},100);



}


/*
2枚目以降はフェード切替
*/

else{


bg.style.opacity="0";


setTimeout(function(){


bg.style.backgroundImage =
"url('" + imageFolder + filename + "')";


bg.classList.remove("zoom");


setTimeout(function(){

bg.style.opacity="1";


setTimeout(function(){

bg.classList.add("zoom");

},100);


},100);



},3000);


}



};



img.src =
imageFolder + filename;


}



// 初回
changeBackground();


// 20秒ごと
setInterval(
changeBackground,
20000
);



})();

</script>


</body>
</html>
