<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Weiß Grafik</title>

<style>

html,body{
    height:100%;
    margin:0;
}


/* 初期背景 */
body{
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}


/* ランダム背景 */
#random-background{
    position:fixed;
    inset:0;
    z-index:0;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0;
    transform:scale(1);

    transition:
        opacity 2s ease,
        transform 10s ease;
}


#random-background.zoom{
    transform:scale(1.06);
}


/* 中央リンク */

.center-link{

    position:relative;
    z-index:2;

    color:#000;
    text-decoration:none;

    font-size:28px;
    letter-spacing:0.25em;

    padding:20px 40px;

    background:rgba(255,255,255,0.85);

}


.center-link:hover{

    opacity:0.65;

}



</style>

</head>


<body>


<div id="random-background"></div>


<a class="center-link"
href="https://www.w-grafik.org/">
Weiß Grafik
</a>



<script>

(function(){


const imageFolder="bg/";
const totalImages=48;

let currentImage=0;


const bg=document.getElementById(
"random-background"
);



function changeBackground(){


let next;


do{

next=Math.floor(
Math.random()*totalImages
)+1;


}while(next===currentImage);



currentImage=next;



const filename=
"bg-"+
String(next).padStart(3,"0")+
".webp";



const img=new Image();



img.onload=function(){


bg.style.opacity="0";


setTimeout(function(){


bg.style.backgroundImage=
"url('"+imageFolder+filename+"')";


bg.classList.remove("zoom");


setTimeout(function(){


bg.style.opacity="1";


bg.classList.add("zoom");


},100);



},2000);



};



img.src=
imageFolder+filename;


}



// 初回表示

changeBackground();



// 10秒ごと切替

setInterval(
changeBackground,
10000
);



})();

</script>


</body>
</html>
